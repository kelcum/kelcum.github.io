<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vela</title>
<meta name="description" content="Filmy i seriale po polsku — Vela">
<meta property="og:title" content="Vela — filmy i seriale">
<meta property="og:description" content="Oglądaj zwiastuny, przeglądaj nowości. Po polsku.">
<meta name="theme-color" content="#05070F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
:root {
  --bg:#05070F; --sf:#0C1020; --sf2:#141829; --sf3:#1E2238;
  --a:#FF5E38; --g:#FFCA6A;
  --dub:#2ECC9A; --lek:#5BA8F5; --nap:#9B7DF5;
  --fg:#F2F3FD; --fg2:#8A90B8; --fg3:#454870; --br:#1C2040;
  --nav:60px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#F3F4FB; --sf:#FFFFFF; --sf2:#EAEBF8; --sf3:#DDDFF0;
    --fg:#08091C; --fg2:#44487A; --fg3:#9095C0; --br:#D8DAF0;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:#F3F4FB; --sf:#FFFFFF; --sf2:#EAEBF8; --sf3:#DDDFF0;
  --fg:#08091C; --fg2:#44487A; --fg3:#9095C0; --br:#D8DAF0;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
img{max-width:100%}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--sf3);border-radius:2px}

/* NAV */
nav{
  position:sticky;top:0;z-index:100;
  height:var(--nav);
  background:color-mix(in srgb,var(--sf) 88%,transparent);
  border-bottom:1px solid var(--br);
  backdrop-filter:blur(20px);
  display:flex;align-items:center;padding:0 24px;gap:20px;
}
.logo{font-family:'DM Serif Display',serif;font-style:italic;font-size:28px;color:var(--fg);text-decoration:none;flex-shrink:0;letter-spacing:-.5px}
.logo sup{font-family:'DM Sans',sans-serif;font-style:normal;font-size:10px;font-weight:700;color:var(--a);vertical-align:super;letter-spacing:1px}
.nav-links{display:flex;gap:2px;list-style:none}
.nav-links a{color:var(--fg2);text-decoration:none;font-size:13px;font-weight:500;padding:6px 12px;border-radius:7px;transition:color .12s,background .12s}
.nav-links a:hover{color:var(--fg);background:var(--sf2)}
.nav-links a.act{color:var(--fg);font-weight:600}
.nav-sp{flex:1}
.nav-r{display:flex;align-items:center;gap:8px}
.sw{display:flex;align-items:center;gap:7px;background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:6px 12px;width:180px;transition:width .2s,border-color .15s}
.sw:focus-within{border-color:var(--a);width:230px}
.sw svg{color:var(--fg3);flex-shrink:0}
.sw input{background:none;border:none;outline:none;color:var(--fg);font:500 13px 'DM Sans',sans-serif;width:100%}
.sw input::placeholder{color:var(--fg3)}
.ib{background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:7px;cursor:pointer;color:var(--fg2);display:flex;align-items:center;transition:color .12s,background .12s}
.ib:hover{color:var(--fg);background:var(--sf3)}
.flag{display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--sf2);border:1px solid var(--br);border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--fg)}
.fl{width:18px;height:12px;border-radius:2px;overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.fl-w{flex:1;background:#fff}
.fl-r{flex:1;background:#DC143C}

/* HERO */
.hero{position:relative;height:520px;overflow:hidden}
.hero-track{display:flex;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.hslide{flex:0 0 100%;position:relative;display:flex;align-items:flex-end}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center top;background-color:var(--sf)}
.hfade{position:absolute;inset:0;background:linear-gradient(to right,var(--bg) 26%,rgba(5,7,15,.55) 60%,transparent 100%),linear-gradient(to top,var(--bg) 0%,transparent 45%)}
.hcontent{position:relative;z-index:2;padding:44px 40px;max-width:580px}
.heyebrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.htype{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--a)}
.hsep{color:var(--fg3)}
.hyear{font-size:12px;color:var(--fg2)}
.hstars{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--g)}
.htitle{font-family:'DM Serif Display',serif;font-style:italic;font-size:clamp(36px,5.5vw,68px);line-height:.95;letter-spacing:-.5px;margin-bottom:12px;text-wrap:balance}
.hdesc{font-size:13.5px;line-height:1.7;color:var(--fg2);margin-bottom:18px;max-width:420px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.haudio{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:20px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hdots{position:absolute;bottom:22px;right:32px;display:flex;gap:6px;z-index:10}
.hdot{height:3px;border-radius:2px;border:none;padding:0;cursor:pointer;transition:background .2s,width .25s;width:22px;background:rgba(255,255,255,.22)}
.hdot.on{width:42px;background:var(--a)}

/* BADGES */
.bd{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.bd-dub{background:color-mix(in srgb,var(--dub) 16%,transparent);color:var(--dub)}
.bd-lek{background:color-mix(in srgb,var(--lek) 16%,transparent);color:var(--lek)}
.bd-nap{background:color-mix(in srgb,var(--nap) 16%,transparent);color:var(--nap)}

/* BTN */
.btn-a{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:9px;background:var(--a);color:#fff;border:none;font:600 13.5px 'DM Sans',sans-serif;cursor:pointer;transition:filter .15s}
.btn-a:hover{filter:brightness(1.1)}
.btn-b{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:9px;background:rgba(255,255,255,.12);color:var(--fg);border:1px solid rgba(255,255,255,.18);font:500 13.5px 'DM Sans',sans-serif;cursor:pointer;backdrop-filter:blur(6px);transition:background .12s}
.btn-b:hover{background:rgba(255,255,255,.2)}

/* SECTIONS */
.section{margin-bottom:38px}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px;margin-bottom:14px}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--fg3);margin-bottom:2px}
.sec-title{font-family:'DM Serif Display',serif;font-size:22px}
.rw{position:relative}
.rscroll{display:flex;gap:12px;padding:6px 30px 10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.rscroll::-webkit-scrollbar{display:none}
.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:36px;height:56px;border:1px solid var(--br);border-radius:10px;background:color-mix(in srgb,var(--sf) 92%,transparent);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);opacity:0;transition:opacity .2s,background .12s}
.rw:hover .arr{opacity:1}
.arr:hover{background:var(--sf2)}
.arr-l{left:4px}
.arr-r{right:4px}

/* CARDS */
.card{flex:0 0 155px;scroll-snap-align:start;cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-6px)}
.card:hover .cposter{box-shadow:0 14px 42px -4px color-mix(in srgb,var(--a) 26%,rgba(0,0,0,.6))}
.cposter{aspect-ratio:2/3;width:100%;border-radius:11px;overflow:hidden;position:relative;background:var(--sf2);transition:box-shadow .2s}
.cposter img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .cposter img{transform:scale(1.04)}
.cfallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-style:italic;font-size:15px;text-align:center;padding:12px;color:rgba(255,255,255,.35);line-height:1.2}
.skel{background:linear-gradient(90deg,var(--sf2) 25%,var(--sf3) 50%,var(--sf2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.cov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.15) 55%,transparent 100%);opacity:0;transition:opacity .18s;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:10px}
.card:hover .cov{opacity:1}
.cplay{width:36px;height:36px;border-radius:50%;background:var(--a);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:6px;box-shadow:0 4px 16px color-mix(in srgb,var(--a) 55%,transparent);transition:transform .15s}
.cplay:hover{transform:scale(1.1)}
.cstar{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--g)}
.cbadges{position:absolute;top:7px;left:7px;display:flex;flex-direction:column;gap:3px}
.cwl{position:absolute;top:7px;right:7px;width:27px;height:27px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);opacity:0;transition:opacity .15s}
.card:hover .cwl{opacity:1}
.cwl.on{opacity:1;color:var(--a)}
.cinfo{padding:8px 2px 0}
.ctitle{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:11px;color:var(--fg3);margin-top:2px}

/* GENRES */
.genres-sec{padding:0 30px;margin-bottom:56px}
.genres-lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--fg3);margin-bottom:4px}
.genres-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:16px}
.gpills{display:flex;flex-wrap:wrap;gap:7px}
.gpill{padding:7px 15px;border-radius:22px;background:var(--sf2);border:1px solid var(--br);font-size:12.5px;font-weight:500;color:var(--fg2);cursor:pointer;transition:all .12s}
.gpill:hover,.gpill.on{background:var(--a);border-color:var(--a);color:#fff}

/* FOOTER */
footer{border-top:1px solid var(--br);padding:32px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.foot-logo{font-family:'DM Serif Display',serif;font-style:italic;font-size:22px;color:var(--fg2)}
.foot-logo sup{font-family:'DM Sans',sans-serif;font-style:normal;font-size:9px;font-weight:700;color:var(--a);vertical-align:super}
.foot-links{display:flex;gap:20px;list-style:none}
.foot-links a{color:var(--fg3);text-decoration:none;font-size:12px;transition:color .12s}
.foot-links a:hover{color:var(--fg2)}
.foot-note{font-size:11px;color:var(--fg3)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(5,7,15,.9);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(14px)}
.modal-bd{position:absolute;inset:0;cursor:default}
.modal{background:var(--sf);border:1px solid var(--br);border-radius:16px;width:100%;max-width:820px;overflow:hidden;display:grid;grid-template-columns:1fr 340px;max-height:calc(100vh - 40px);position:relative;z-index:1}
.mplayer{position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-height:300px}
.mplayer iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
.mcover{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.mcover-dim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.mplay-btn{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;background:var(--a);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 32px color-mix(in srgb,var(--a) 55%,transparent);transition:transform .15s,filter .15s}
.mplay-btn:hover{transform:scale(1.08);filter:brightness(1.1)}
.msidebar{padding:24px;overflow-y:auto;display:flex;flex-direction:column}
.mx{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
.mttl{font-family:'DM Serif Display',serif;font-style:italic;font-size:24px;line-height:1.1;margin-bottom:6px}
.mmeta{font-size:12px;color:var(--fg2);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.mbadges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.moverview{font-size:12.5px;line-height:1.65;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px;border-top:1px solid var(--br);padding-top:14px}
.mopt{margin-bottom:12px}
.mlbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg3);margin-bottom:5px}
.msel{width:100%;background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:8px 10px;color:var(--fg);font:500 13px 'DM Sans',sans-serif;cursor:pointer;outline:none;transition:border-color .12s}
.msel:focus{border-color:var(--a)}
.mqual{display:flex;gap:5px;flex-wrap:wrap}
.mq{padding:5px 11px;border-radius:7px;border:1px solid var(--br);background:var(--sf2);color:var(--fg2);font:600 11px 'DM Sans',sans-serif;cursor:pointer;transition:all .12s}
.mq.on,.mq:hover{background:var(--a);border-color:var(--a);color:#fff}
.macts{margin-top:16px;padding-top:16px;border-top:1px solid var(--br);display:flex;gap:8px;flex-direction:column}
.mwl-btn{padding:10px 16px;border-radius:9px;background:var(--sf2);color:var(--fg);border:1px solid var(--br);font:500 13px 'DM Sans',sans-serif;cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:7px;justify-content:center}
.mwl-btn:hover{background:var(--sf3)}

/* SETTINGS MODAL */
.settings-modal{position:fixed;inset:0;background:rgba(5,7,15,.85);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(12px)}
.settings-box{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:32px;max-width:400px;width:100%}
.settings-h{font-size:16px;font-weight:700;margin-bottom:6px}
.settings-p{font-size:12.5px;color:var(--fg2);line-height:1.6;margin-bottom:20px}
.settings-p a{color:var(--a)}
.settings-input{width:100%;padding:10px 14px;background:var(--sf2);border:1px solid var(--br);border-radius:8px;color:var(--fg);font:500 13px 'DM Sans',sans-serif;outline:none;margin-bottom:10px;transition:border-color .15s}
.settings-input:focus{border-color:var(--a)}
.settings-btns{display:flex;gap:8px}
.settings-save{flex:1;padding:10px;border-radius:8px;background:var(--a);color:#fff;border:none;font:600 13px 'DM Sans',sans-serif;cursor:pointer;transition:filter .15s}
.settings-save:hover{filter:brightness(1.1)}
.settings-cancel{padding:10px 16px;border-radius:8px;background:var(--sf2);color:var(--fg2);border:1px solid var(--br);font:500 13px 'DM Sans',sans-serif;cursor:pointer;transition:background .12s}
.settings-cancel:hover{background:var(--sf3)}
.settings-err{font-size:11.5px;color:#F87171;margin-bottom:10px}

/* NO KEY */
.nokey{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px;text-align:center;padding:40px}
.nokey-logo{font-family:'DM Serif Display',serif;font-style:italic;font-size:48px;margin-bottom:4px}
.nokey-logo sup{font-family:'DM Sans',sans-serif;font-style:normal;font-size:10px;font-weight:700;color:var(--a);vertical-align:super}
.nokey p{color:var(--fg2);font-size:14px;max-width:380px;line-height:1.65}
.nokey a{color:var(--a)}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--br);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:500;z-index:1000;animation:tIn .2s ease,tOut .2s ease 2.3s forwards;white-space:nowrap}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes tOut{to{opacity:0}}

@media(max-width:900px){.modal{grid-template-columns:1fr}}
@media(max-width:600px){.nav-links{display:none}.htitle{font-size:clamp(28px,8vw,44px)}.hero{height:420px}}
@media(prefers-reduced-motion:reduce){.card,.hero-track{transition:none!important}.skel{animation:none;background:var(--sf2)}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="/">Vela<sup>PL</sup></a>
  <ul class="nav-links">
    <li><a href="#" class="act">Główna</a></li>
    <li><a href="#">Gatunki</a></li>
    <li><a href="#">Moja Lista</a></li>
  </ul>
  <div class="nav-sp"></div>
  <div class="nav-r">
    <div class="sw">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchQ" type="text" placeholder="Szukaj…">
    </div>
    <div class="flag"><div class="fl"><div class="fl-w"></div><div class="fl-r"></div></div>PL</div>
    <button class="ib" id="themeBtn" title="Motyw">
      <svg id="themeIco" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="ib" id="settingsBtn" title="Ustawienia API">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</nav>

<main id="main"></main>

<footer>
  <div class="foot-logo">Vela<sup>PL</sup></div>
  <ul class="foot-links">
    <li><a href="#">Regulamin</a></li>
    <li><a href="#">Prywatność</a></li>
  </ul>
  <span class="foot-note">Dane filmowe: TMDB</span>
</footer>

<!-- PLAYER MODAL -->
<div class="modal-bg" id="M" style="display:none">
  <div class="modal-bd" id="Mbg"></div>
  <div class="modal">
    <div class="mplayer" id="mplayer">
      <div class="mcover" id="mcover">
        <div class="mcover-dim"></div>
        <button class="mplay-btn" id="mPlayBtn"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
      </div>
      <button class="mx" id="MX"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="msidebar">
      <div class="mttl" id="MTTL"></div>
      <div class="mmeta" id="MMETA"></div>
      <div class="mbadges" id="MBADGES"></div>
      <div class="moverview" id="MOVERVIEW"></div>
      <div class="mopt"><div class="mlbl">Ścieżka dźwiękowa</div><select class="msel" id="ASEL"></select></div>
      <div class="mopt"><div class="mlbl">Napisy</div><select class="msel" id="SSEL"></select></div>
      <div class="mopt">
        <div class="mlbl">Jakość obrazu</div>
        <div class="mqual"><button class="mq">SD</button><button class="mq">720p</button><button class="mq on">1080p</button><button class="mq">4K</button></div>
      </div>
      <div class="macts">
        <button class="btn-a" id="mWatchBtn" style="justify-content:center"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>Oglądaj zwiastun</button>
        <button class="mwl-btn" id="MWL"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Dodaj do Mojej Listy</button>
      </div>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="settings-modal" id="SM" style="display:none">
  <div class="settings-box">
    <div class="settings-h">Klucz API TMDB</div>
    <div class="settings-p">Darmowy klucz wygenerujesz na <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org/settings/api</a>. Klucz jest przechowywany lokalnie w Twojej przeglądarce.</div>
    <div class="settings-err" id="serr" style="display:none"></div>
    <input id="keyInput" class="settings-input" type="text" placeholder="Wklej klucz API (v3 auth)…">
    <div class="settings-btns">
      <button class="settings-cancel" id="scancel">Anuluj</button>
      <button class="settings-save" id="ssave">Zapisz i załaduj</button>
    </div>
  </div>
</div>

<script>
const TMDB='https://api.themoviedb.org/3',IMG_W='https://image.tmdb.org/t/p/w342',IMG_BD='https://image.tmdb.org/t/p/w1280',YT='https://www.youtube-nocookie.com/embed/'
const GMAP={28:"Akcja",12:"Przygoda",16:"Animacja",35:"Komedia",80:"Kryminał",99:"Dokumentalny",18:"Dramat",10751:"Familijny",14:"Fantasy",36:"Historia",27:"Horror",10402:"Muzyczny",9648:"Tajemnica",10749:"Romantyczny",878:"Sci-Fi",53:"Thriller",10752:"Wojenny",37:"Western"}
const AL={"pl-dub":"🎙 Polski Dubbing","pl-lek":"🎤 Polski Lektor","en":"🔊 English (oryginał)","jp":"🗾 Japoński (oryginał)","ko":"🇰🇷 Koreański (oryginał)"}
const SL={pl:"Polskie napisy",en:"Angielskie napisy",off:"Brak napisów"}
let KEY='',wl=[],hi=0,htimer,currentKey=null
try{KEY=localStorage.getItem('vela_key')||''}catch(e){}
try{wl=JSON.parse(localStorage.getItem('vela_wl')||'[]')}catch(e){}
let th='dark';try{th=localStorage.getItem('vela_th')||'dark'}catch(e){}
function setTheme(){document.documentElement.dataset.theme=th;document.getElementById('themeIco').innerHTML=th==='dark'?'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'}
setTheme()
document.getElementById('themeBtn').onclick=()=>{th=th==='dark'?'light':'dark';setTheme();try{localStorage.setItem('vela_th',th)}catch(e){}}
async function tmdb(path,extra=''){const r=await fetch(`${TMDB}${path}?api_key=${KEY}&language=pl-PL${extra}`);if(!r.ok)throw new Error(r.status);return r.json()}
function plAudio(item,isTV=false){const gids=item.genre_ids||(item.genres?item.genres.map(g=>g.id):[]);const lang=item.original_language;if(lang==='pl')return{audio:['pl'],subs:[]};const audio=[],subs=['pl','en'];if(gids.includes(16)&&lang!=='ja'){audio.push('pl-dub');audio.push('en')}else if(lang==='ja'){audio.push('pl-lek');audio.push('jp')}else if(lang==='ko'){audio.push('pl-lek');audio.push('ko')}else if(isTV){audio.push('pl-lek');audio.push('en')}else{audio.push('pl-dub');audio.push('pl-lek');audio.push('en')}return{audio,subs}}
function bh(a,s){const st=s?'font-size:9px':'';if(a==='pl-dub')return`<span class="bd bd-dub" style="${st}">🎙 Dubbing</span>`;if(a==='pl-lek')return`<span class="bd bd-lek" style="${st}">🎤 Lektor</span>`;return''}
function badgesHtml(audio,small){return audio.filter(a=>a.startsWith('pl')).map(a=>bh(a,small)).join('')}
function mkCard(item,isTV=false){const id=item.id,title=item.title||item.name||'—',year=(item.release_date||item.first_air_date||'').slice(0,4),poster=item.poster_path?IMG_W+item.poster_path:null,rating=item.vote_average?item.vote_average.toFixed(1):'?',{audio}=plAudio(item,isTV),inWL=wl.includes(id),c=document.createElement('div');c.className='card';c.innerHTML=`<div class="cposter">${poster?`<img src="${poster}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=cfallback>${title.replace(/</g,'&lt;')}</div>'">`:`<div class="cfallback skel">${title}</div>`}<div class="cbadges">${badgesHtml(audio,true)}</div><button class="cwl ${inWL?'on':''}" data-wl="${id}"><svg width="11" height="11" viewBox="0 0 24 24" fill="${inWL?'currentColor':'none'}" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button><div class="cov"><button class="cplay"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg></button><div class="cstar"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${rating}</div></div></div><div class="cinfo"><div class="ctitle">${title}</div><div class="cmeta">${year} · ${isTV?'Serial':'Film'}</div></div>`;c.querySelector('.cplay').addEventListener('click',e=>{e.stopPropagation();openModal(item,isTV)});c.querySelector('.cwl').addEventListener('click',e=>{e.stopPropagation();toggleWL(id)});c.addEventListener('click',()=>openModal(item,isTV));return c}
function skelRow(id,n=10){const el=document.getElementById(id);for(let i=0;i<n;i++){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="cposter skel" style="aspect-ratio:2/3;border-radius:11px"></div><div style="height:14px;border-radius:4px;margin-top:9px" class="skel"></div><div style="height:11px;border-radius:4px;margin-top:5px;width:60%" class="skel"></div>`;el.appendChild(d)}}
function toggleWL(id){const i=wl.indexOf(id);if(i===-1)wl.push(id);else wl.splice(i,1);try{localStorage.setItem('vela_wl',JSON.stringify(wl))}catch(e){}document.querySelectorAll(`[data-wl="${id}"]`).forEach(b=>{const on=wl.includes(id);b.classList.toggle('on',on);b.querySelector('svg')?.setAttribute('fill',on?'currentColor':'none')});toast(wl.includes(id)?'✓ Dodano do Mojej Listy':'Usunięto z Mojej Listy')}
function buildHero(items){const track=document.getElementById('HT'),dots=document.getElementById('HD');track.innerHTML='';dots.innerHTML='';items.slice(0,5).forEach((m,i)=>{const bd=m.backdrop_path?IMG_BD+m.backdrop_path:null,title=m.title||m.name||'—',year=(m.release_date||m.first_air_date||'').slice(0,4),rating=m.vote_average?m.vote_average.toFixed(1):'?',{audio}=plAudio(m),s=document.createElement('div');s.className='hslide';s.innerHTML=`<div class="hbg" ${bd?`style="background-image:url('${bd}')"`:''}/><div class="hfade"></div><div class="hcontent"><div class="heyebrow"><span class="htype">${m.media_type==='tv'?'SERIAL':'FILM'}</span><span class="hsep">·</span><span class="hyear">${year}</span><span class="hsep">·</span><span class="hstars"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${rating}</span></div><h1 class="htitle">${title}</h1><p class="hdesc">${m.overview||'Brak opisu.'}</p><div class="haudio">${badgesHtml(audio)}<span class="bd bd-nap">📝 Napisy PL</span></div><div class="hbtns"><button class="btn-a hplay">▶ Oglądaj zwiastun</button><button class="btn-b hwl">+ Moja Lista</button></div></div>`;s.querySelector('.hplay').addEventListener('click',()=>openModal(m,m.media_type==='tv'));s.querySelector('.hwl').addEventListener('click',()=>toggleWL(m.id));track.appendChild(s);const dot=document.createElement('button');dot.className='hdot'+(i===0?' on':'');dot.onclick=()=>goHero(i);dots.appendChild(dot)});clearInterval(htimer);htimer=setInterval(()=>goHero((hi+1)%Math.min(items.length,5)),7000)}
function goHero(i){hi=i;document.getElementById('HT').style.transform=`translateX(-${i*100}%)`;document.querySelectorAll('.hdot').forEach((d,j)=>d.classList.toggle('on',j===i))}
async function openModal(item,isTV=false){currentKey=null;const title=item.title||item.name||'—',year=(item.release_date||item.first_air_date||'').slice(0,4),rating=item.vote_average?item.vote_average.toFixed(1):'?',bd=item.backdrop_path?IMG_BD+item.backdrop_path:null,genres=(item.genre_ids||[]).map(id=>GMAP[id]).filter(Boolean).slice(0,3).join(', '),{audio,subs}=plAudio(item,isTV);document.getElementById('MTTL').textContent=title;document.getElementById('MMETA').innerHTML=`<span>${isTV?'Serial':'Film'}</span><span>·</span><span>${year}</span><span>·</span><span style="color:var(--g)">★ ${rating}</span>${genres?`<span>·</span><span>${genres}</span>`:''}`;document.getElementById('MOVERVIEW').textContent=item.overview||'Brak opisu.';document.getElementById('MBADGES').innerHTML=badgesHtml(audio)+`<span class="bd bd-nap">📝 Napisy PL</span>`;const mc=document.getElementById('mcover');mc.style.backgroundImage=bd?`url('${bd}')`:'none';mc.style.display='flex';document.getElementById('mplayer').querySelector('iframe')?.remove();const asel=document.getElementById('ASEL');asel.innerHTML='';audio.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=AL[a]||a;if(a==='pl-dub'||(a==='pl-lek'&&!audio.includes('pl-dub')))o.selected=true;asel.appendChild(o)});const ssel=document.getElementById('SSEL');ssel.innerHTML='';(subs.length?subs:['en']).concat(['off']).forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=SL[s]||s;if(s==='pl')o.selected=true;ssel.appendChild(o)});refreshMWL(item.id);document.getElementById('MWL').onclick=()=>{toggleWL(item.id);refreshMWL(item.id)};document.getElementById('M').style.display='flex';try{const vdata=await tmdb(`/${isTV?'tv':'movie'}/${item.id}/videos`),vids=vdata.results||[],pick=vids.find(v=>v.type==='Trailer'&&v.site==='YouTube'&&v.iso_639_1==='pl')||vids.find(v=>v.type==='Trailer'&&v.site==='YouTube')||vids.find(v=>v.site==='YouTube');currentKey=pick?.key||null}catch(e){currentKey=null}}
function refreshMWL(id){const on=wl.includes(id);document.getElementById('MWL').innerHTML=on?'✓ Na Mojej Liście':'+ Dodaj do Mojej Listy'}
function playTrailer(){if(!currentKey){toast('Brak zwiastuna');return}const pl=document.getElementById('mplayer');document.getElementById('mcover').style.display='none';pl.querySelector('iframe')?.remove();const iframe=document.createElement('iframe');iframe.allowFullscreen=true;iframe.allow='autoplay; fullscreen';iframe.src=`${YT}${currentKey}?autoplay=1&rel=0`;pl.appendChild(iframe)}
function closeModal(){document.getElementById('M').style.display='none';document.getElementById('mplayer').querySelector('iframe')?.remove();document.getElementById('mcover').style.display='flex'}
document.getElementById('MX').onclick=closeModal;document.getElementById('Mbg').onclick=closeModal;document.getElementById('mPlayBtn').onclick=playTrailer;document.getElementById('mWatchBtn').onclick=playTrailer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.querySelectorAll('.mq').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mq').forEach(x=>x.classList.remove('on'));b.classList.add('on')}))
function sh(id,dir){document.getElementById(id).scrollBy({left:dir*(155+12)*4,behavior:'smooth'})}
function buildGenres(el){el.innerHTML='';Object.values(GMAP).forEach(g=>{const b=document.createElement('button');b.className='gpill';b.textContent=g;b.onclick=()=>b.classList.toggle('on');el.appendChild(b)})}
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2700)}
function openSettings(){document.getElementById('keyInput').value=KEY;document.getElementById('serr').style.display='none';document.getElementById('SM').style.display='flex'}
function closeSettings(){document.getElementById('SM').style.display='none'}
document.getElementById('settingsBtn').onclick=openSettings;document.getElementById('scancel').onclick=closeSettings;document.getElementById('SM').addEventListener('click',e=>{if(e.target===document.getElementById('SM'))closeSettings()})
document.getElementById('ssave').onclick=async()=>{const k=document.getElementById('keyInput').value.trim();if(!k){showSerr('Podaj klucz API.');return}const btn=document.getElementById('ssave');btn.textContent='Sprawdzanie…';try{const r=await fetch(`${TMDB}/configuration?api_key=${k}`);if(!r.ok)throw new Error();KEY=k;try{localStorage.setItem('vela_key',k)}catch(e){}closeSettings();loadAll()}catch(e){showSerr('Nieprawidłowy klucz.')}btn.textContent='Zapisz i załaduj'}
document.getElementById('keyInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('ssave').click()})
function showSerr(m){const e=document.getElementById('serr');e.textContent=m;e.style.display='block'}
let stimer;document.getElementById('searchQ').addEventListener('input',function(){clearTimeout(stimer);const q=this.value.trim();if(!q){if(KEY)loadAll();return}stimer=setTimeout(()=>doSearch(q),400)})
async function doSearch(q){if(!KEY)return;try{const data=await tmdb('/search/multi',`&query=${encodeURIComponent(q)}&include_adult=false`),res=(data.results||[]).filter(r=>r.media_type!=='person').slice(0,20);renderApp([{label:'Wyniki dla „'+q+'"',sub:'Szukaj',id:'sr'}]);res.forEach(item=>document.getElementById('sr').appendChild(mkCard(item,item.media_type==='tv')))}catch(e){}}
function renderApp(sections){document.getElementById('main').innerHTML=`<section class="hero"><div class="hero-track" id="HT"></div><div class="hdots" id="HD"></div></section>${sections.map(s=>`<section class="section"><div class="sec-hd"><div><div class="sec-lbl">${s.sub}</div><h2 class="sec-title">${s.label}</h2></div></div><div class="rw"><button class="arr arr-l" onclick="sh('${s.id}',-1)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button><div class="rscroll" id="${s.id}"></div><button class="arr arr-r" onclick="sh('${s.id}',1)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button></div></section>`).join('')}<div class="genres-sec"><div class="genres-lbl">Przeglądaj według</div><h2 class="genres-title">Gatunki</h2><div class="gpills" id="GP"></div></div>`;buildGenres(document.getElementById('GP'))}
function renderNoKey(){document.getElementById('main').innerHTML=`<div class="nokey"><div class="nokey-logo">Vela<sup>PL</sup></div><p>Podaj klucz API <a href="https://www.themoviedb.org/settings/api" target="_blank">TMDB</a> — kliknij ⚙️ w prawym górnym rogu.</p><button class="btn-a" onclick="openSettings()">Dodaj klucz API</button></div>`}
async function loadAll(){const SECTIONS=[{label:'Na Czasie',sub:'Trending w Polsce',id:'r1'},{label:'Nowe Premiery',sub:'Właśnie w kinach',id:'r2'},{label:'Na Antenie',sub:'Seriale na żywo',id:'r3',isTV:true},{label:'Popularne Anime',sub:'Z Japonii i nie tylko',id:'r4',isTV:true},{label:'Kino Polskie',sub:'Rodzima produkcja',id:'r5'}];renderApp(SECTIONS);SECTIONS.forEach(s=>skelRow(s.id));try{const[trend,now,air,anime,pl]=await Promise.all([tmdb('/trending/all/week'),tmdb('/movie/now_playing','&region=PL'),tmdb('/tv/on_the_air','&timezone=Europe/Warsaw'),tmdb('/discover/tv','&with_genres=16&with_origin_country=JP&sort_by=popularity.desc'),tmdb('/discover/movie','&with_original_language=pl&sort_by=popularity.desc')]);buildHero(trend.results||[]);function fill(id,items,isTV=false){const el=document.getElementById(id);el.innerHTML='';if(!items.length){el.innerHTML='<div style="padding:20px;color:var(--fg3)">Brak wyników.</div>';return}items.forEach(item=>el.appendChild(mkCard(item,isTV)))}fill('r1',(trend.results||[]).slice(0,20));fill('r2',(now.results||[]).slice(0,20));fill('r3',(air.results||[]).slice(0,20),true);fill('r4',(anime.results||[]).slice(0,20),true);fill('r5',(pl.results||[]).slice(0,20))}catch(e){document.querySelectorAll('.rscroll').forEach(el=>{el.innerHTML='<div style="padding:20px;color:var(--fg3)">Błąd — sprawdź klucz API.</div>'})}}
if(KEY){fetch(`${TMDB}/configuration?api_key=${KEY}`).then(r=>{if(r.ok)loadAll();else{try{localStorage.removeItem('vela_key')}catch(e){}KEY='';renderNoKey()}}).catch(()=>{KEY='';renderNoKey()})}else{renderNoKey()}
</script>
</body>
</html>
